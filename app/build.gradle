plugins { id 'com.android.application' }

// ★可选：本地签名（不提交 keystore）
//   1. 生成密钥库：
//      keytool -genkeypair -v -keystore release.keystore -alias dshconsole \
//              -keyalg RSA -keysize 2048 -validity 10000
//   2. 在 ~/.gradle/gradle.properties 写入：
//      DSHCONSOLE_STORE_FILE=/绝对路径/release.keystore
//      DSHCONSOLE_STORE_PASSWORD=...
//      DSHCONSOLE_KEY_ALIAS=dshconsole
//      DSHCONSOLE_KEY_PASSWORD=...
def ksFile = project.findProperty('DSHCONSOLE_STORE_FILE')?.toString()
def ksStorePass = project.findProperty('DSHCONSOLE_STORE_PASSWORD')?.toString()
def ksAlias = project.findProperty('DSHCONSOLE_KEY_ALIAS')?.toString()
def ksKeyPass = project.findProperty('DSHCONSOLE_KEY_PASSWORD')?.toString()
def hasSigning = ksFile && ksStorePass && ksAlias && ksKeyPass

android {
    namespace 'io.github.dshconsole.app'
    compileSdk 36

    defaultConfig {
        applicationId "io.github.dshconsole.app"
        minSdk 28
        targetSdk 36
        versionCode 1
        versionName "1.0"
    }

    // ★签名配置
    signingConfigs {
        if (hasSigning) {
            release {
                storeFile file(ksFile)
                storePassword ksStorePass
                keyAlias ksAlias
                keyPassword ksKeyPass
            }
        }
    }

    buildTypes {
        release {
            // 未配置签名时产出未签名 APK（开源版由使用者自行签名）
            minifyEnabled true
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasSigning) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            minifyEnabled false
            if (hasSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding false
    }

    lint { abortOnError false }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}

if (hasSigning) {
    logger.lifecycle("DSH Console: release signing enabled (alias=${ksAlias})")
} else {
    logger.lifecycle("DSH Console: no signing config found, producing unsigned release APK")
}
